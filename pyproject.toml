[project]
name = "ashby-cli"
version = "0.1.0"
description = "Agent-friendly, read-only command-line wrapper over the Ashby HQ public API"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "requests>=2.32",
  # Floor excludes the compromised eMudhra intermediates (Oct 2026).
  "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "responses>=0.25",
]

[project.scripts]
ashby = "ashby_cli.cli:main_entry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashby_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
